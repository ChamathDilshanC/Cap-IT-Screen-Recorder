name: Release installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and project versions
        shell: pwsh
        run: |
          [xml]$project = Get-Content ScreenRecorderApp.csproj
          $projectVersion = ($project.Project.PropertyGroup.Version | Select-Object -First 1).ToString()
          $tagVersion = "${{ github.ref_name }}".TrimStart('v', 'V')
          if ($projectVersion -ne $tagVersion) {
            throw "Version mismatch: ScreenRecorderApp.csproj is $projectVersion but the pushed tag is ${{ github.ref_name }}."
          }

          $installer = Get-Content Installer\CapITScreenRecorder.iss |
            Select-String '#define MyAppVersion "([^"]+)"'
          $installerVersion = $installer.Matches[0].Groups[1].Value
          if ($installerVersion -ne $projectVersion) {
            throw "Version mismatch: Inno Setup script is $installerVersion but the project is $projectVersion."
          }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --title "Cap-IT Screen Recorder ${{ github.ref_name }}" `
            --generate-notes

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Inno Setup
        uses: ConorMacBride/install-inno-action@v1

      - name: Restore
        run: dotnet restore -p:Platform=x64

      - name: Publish self-contained app
        run: dotnet publish ScreenRecorderApp.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o publish

      - name: Build installer
        run: iscc Installer\CapITScreenRecorder.iss

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v', 'V')
          gh release upload "${{ github.ref_name }}" `
            "Installer\Output\CapIT-Screen-Recorder-Setup-$version.exe" `
            --repo "${{ github.repository }}" --clobber
