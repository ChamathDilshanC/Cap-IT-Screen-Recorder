name: Release installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate tag and project versions
        shell: pwsh
        run: |
          [xml]$project = Get-Content ScreenRecorderApp.csproj
          $projectVersion = ($project.Project.PropertyGroup.Version | Select-Object -First 1).ToString()
          $tagVersion = "${{ inputs.tag || github.ref_name }}".TrimStart('v', 'V')
          if ($projectVersion -ne $tagVersion) {
            throw "Version mismatch: ScreenRecorderApp.csproj is $projectVersion but the release tag is ${{ inputs.tag || github.ref_name }}."
          }

          $installer = Get-Content Installer\CapITScreenRecorder.iss |
            Select-String '#define MyAppVersion "([^"]+)"'
          $installerVersion = $installer.Matches[0].Groups[1].Value
          if ($installerVersion -ne $projectVersion) {
            throw "Version mismatch: Inno Setup script is $installerVersion but the project is $projectVersion."
          }

      - name: Create GitHub release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" `
              --repo "${{ github.repository }}" `
              --title "Cap-IT Screen Recorder $env:RELEASE_TAG" `
              --generate-notes
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Restore
        run: dotnet restore -p:Platform=x64

      - name: Publish self-contained app
        run: dotnet publish ScreenRecorderApp.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o publish

      - name: Build installer
        run: iscc Installer\CapITScreenRecorder.iss

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "$env:RELEASE_TAG".TrimStart('v', 'V')
          gh release upload "$env:RELEASE_TAG" `
            "Installer\Output\CapIT-Screen-Recorder-Setup-$version.exe" `
            --repo "${{ github.repository }}" --clobber
