name: Build

# The app targets net8.0-windows10.0.19041.0 (Windows Graphics Capture, Media Foundation, WASAPI), so
# this runs on windows-latest. It verifies every project in the solution — the Avalonia desktop app,
# the Windows recording engine, the core library and the regression checks — compiles on every push/PR.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CapIT.sln

      - name: Build
        run: dotnet build CapIT.sln -c Release --no-restore
